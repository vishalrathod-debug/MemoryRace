name: Build Android app

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Initialize EAS project
        run: eas init --non-interactive

      - name: Build Android APK with EAS
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download Android APK
        run: eas build:download --platform android --profile preview --latest --path memoryrace.apk --non-interactive

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: memoryrace-android
          path: memoryrace.apk