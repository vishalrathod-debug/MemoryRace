name: Build Android app

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Initialize EAS project
        run: eas init --non-interactive

      - name: Build Android APK with EAS
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download Android APK
        run: eas build:download --platform android --profile preview --latest --path memoryrace.apk --non-interactive

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: memoryrace-android
          path: memoryrace.apk